<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>MedTrack – Medicine Reminder & Health Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1f7f9;--c:#fff;--t:#17323d;--m:#5d7882;--p:#0e9aa7;--p2:#067a85;--b:#dbe8ec;--ok:#1b9d5a;--wn:#d98a0b;--er:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--c:#16262e;--t:#e6f2f5;--m:#8fa9b2;--b:#25404a}}
:root[data-theme="dark"]{--bg:#0e1a20;--c:#16262e;--t:#e6f2f5;--m:#8fa9b2;--b:#25404a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
h2,h3{margin:.2em 0}.hide{display:none!important}
button,input,select,textarea{font:inherit;color:var(--t)}input,select,textarea{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:.2s}.btn:hover{background:var(--p2);transform:translateY(-1px)}
.btn.s{background:var(--c);color:var(--t);border:1px solid var(--b)}.btn.d{background:var(--er)}.btn.g{background:var(--ok)}.btn.w{background:var(--wn)}.btn.sm{padding:4px 9px;font-size:13px;margin:1px}
#auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#0e9aa7,#6fd0c5)}
.box{background:var(--c);border-radius:20px;padding:26px;width:100%;max-width:440px;box-shadow:0 20px 50px #0003;animation:up .5s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.err{color:var(--er);font-size:13px;min-height:18px}
#app{display:flex;min-height:100vh}#side{width:240px;background:var(--c);border-right:1px solid var(--b);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{font-size:22px;font-weight:700;color:var(--p)}.tag{font-size:11px;color:var(--m);margin-bottom:12px}
#side a{display:flex;gap:8px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--t);text-decoration:none;align-items:center}
#side a:hover{background:var(--bg)}#side a.on{background:var(--p);color:#fff}.dot{background:var(--er);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:auto}
#main{flex:1;padding:20px;min-width:0;max-width:1200px}#top{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:14px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin-bottom:14px;transition:.2s;animation:up .4s}.card:hover{box-shadow:0 6px 20px #0001}
.card .v{font-size:24px;font-weight:700}.card .l{color:var(--m);font-size:13px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar h2{margin-right:auto}.bar input,.bar select{width:auto;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--c);border-radius:12px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-size:12px;text-transform:uppercase}
.bd{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#0001}.Taken{background:#1b9d5a22;color:var(--ok)}.Skipped{background:#d6454522;color:var(--er)}.Pending,.Snoozed{background:#d98a0b22;color:var(--wn)}.Upcoming{background:#0e9aa722;color:var(--p)}
.prog{height:14px;background:var(--b);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#0e9aa7,#5ac8fa);transition:width .5s}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}svg text{fill:var(--m);font-size:10px}
#ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:9;overflow:auto}.mod{background:var(--c);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;animation:up .3s}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:20;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.nt{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--b)}.nt.un{font-weight:600;background:#0e9aa711}.sos{background:var(--er);color:#fff;font-size:18px;padding:14px 22px;border-radius:14px;text-decoration:none;display:inline-block;font-weight:700}
@media(max-width:800px){#side{position:fixed;left:-260px;z-index:8;transition:.3s;width:240px}#side.open{left:0}#top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}#app{flex-direction:column}.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="auth" class="hide"><div class="box"><div class="logo">💊 MedTrack</div><div class="tag">Your Medicine. Your Health. Your Reminder.</div>
<div class="tabs"><button class="btn" id="tl" onclick="tab(0)">Login</button><button class="btn s" id="tr" onclick="tab(1)">Register</button></div>
<form id="lf" onsubmit="login(event)"><label>Email</label><input name="e" type="email" required value="demo@medtrack.com"><label>Password</label><input name="p" type="password" required value="demo123">
<label style="display:flex;gap:8px;align-items:center"><input name="r" type="checkbox" style="width:auto"> Remember me</label><div class="err" id="le"></div><button class="btn" style="width:100%">Login</button><p style="text-align:center"><a href="#" onclick="forgot();return false">Forgot password?</a></p></form>
<form id="rf" class="hide" onsubmit="reg(event)"><label>Full Name</label><input name="n"><label>Email</label><input name="e"><div class="g2"><div><label>Phone</label><input name="ph"></div><div><label>Age</label><input name="a" type="number"></div></div>
<label>Gender</label><select name="g"><option>Female</option><option>Male</option><option>Other</option></select><div class="g2"><div><label>Password</label><input name="p" type="password"></div><div><label>Confirm</label><input name="c" type="password"></div></div><div class="err" id="re"></div><button class="btn" style="width:100%">Create account</button></form></div></div>
<div id="app" class="hide"><div id="top"><button class="btn s" onclick="$('#side').classList.toggle('open')" aria-label="Menu">☰</button><b style="color:var(--p)">💊 MedTrack</b></div>
<nav id="side"></nav><main id="main"></main></div><div id="ov" class="hide"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA'),hm=()=>new Date().toTimeString().slice(0,5),mins=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const fmt=t=>{if(!t)return'';let h=+t.slice(0,2);return(h%12||12)+t.slice(2,5)+(h<12?' AM':' PM')};
const dAgo=n=>{let d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
function mk(n,e,p,pw,a,g){const t=today();return{id:Date.now()+Math.random(),name:n,email:e,phone:p,pw,age:a,gender:g,height:165,weight:62,photo:'',ec:{name:'',rel:'',phone:''},
med:[{id:1,name:'Paracetamol',type:'Tablet',dose:'500 mg',time:'09:00',freq:'Once Daily',start:t,end:'',food:'After Food',notes:'For fever/pain',s:'Taken',sd:t},
{id:2,name:'Vitamin D',type:'Tablet',dose:'1 Tablet',time:'13:00',freq:'Once Daily',start:t,end:'',food:'After Food',notes:'',s:'',sd:''},
{id:3,name:'Calcium',type:'Tablet',dose:'1 Tablet',time:'20:00',freq:'Once Daily',start:t,end:'',food:'After Food',notes:'',s:'',sd:''}],
hl:[6,5,4,3,2,1,0].map((i,k)=>({id:k+1,date:dAgo(i),weight:62+[0,.2,-.1,.3,.1,-.2,0][k],height:165,bp:['118/78','122/80','120/79','125/82','119/77','121/80','118/76'][k],hr:70+k%4*3,sugar:90+k*2,temp:36.6,sleep:6+k%3,water:1800+k*100,steps:5000+k*900,cal:1900+k*40})),
ap:[{id:1,doctor:'Dr. Sharma',hospital:'City Clinic',date:dAgo(-3),time:'11:00',reason:'General checkup',notes:''}],hi:[{id:1,kind:'Allergy',title:'Dust allergy',date:'',notes:'Mild'}],
nt:[],water:{goal:2500,intake:0,d:t},set:{dark:false,notif:true,water:true}}}
let S;try{S=JSON.parse(localStorage.getItem('mt'))}catch(e){}S=S||{users:[mk('Demo User','demo@medtrack.com','9876543210','demo123',28,'Female')],cur:null};
const save=()=>{try{localStorage.setItem('mt',JSON.stringify(S))}catch(e){}};
let U=null,V='dash',busy=false;const u=()=>U;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)}
function notify(k,m){U.nt.unshift({id:Date.now()+Math.random(),k,m,t:new Date().toLocaleString(),r:0});save()}
function modal(h){$('#ov').innerHTML='<div class="mod">'+h+'</div>';$('#ov').classList.remove('hide')}
function closeM(){$('#ov').classList.add('hide');$('#ov').innerHTML='';busy=false}
function confirmD(m,fn){modal(`<h3>Confirm</h3><p>${m}</p><button class="btn d" onclick="(${fn})();closeM()">Yes, delete</button> <button class="btn s" onclick="closeM()">Cancel</button>`)}
/* auth */
function tab(i){$('#lf').classList.toggle('hide',!!i);$('#rf').classList.toggle('hide',!i);$('#tl').className='btn'+(i?' s':'');$('#tr').className='btn'+(i?'':' s')}
function login(ev){ev.preventDefault();const f=new FormData(ev.target),x=S.users.find(a=>a.email.toLowerCase()==f.get('e').trim().toLowerCase()&&a.pw===f.get('p'));
if(!x){$('#le').textContent='Invalid email or password.';return}
if(f.get('r')){S.cur=x.id;save()}else sessionStorage.mt_cur=x.id;try{Notification.requestPermission()}catch(e){}boot(x)}
function reg(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),e=s=>$('#re').textContent=s;
if(!f.n.trim())return e('Full name is required.');if(!/^\S+@\S+\.\S+$/.test(f.e))return e('Enter a valid email.');if(!/^\+?\d{10,13}$/.test(f.ph))return e('Enter a valid phone (10–13 digits).');
if(!(f.a>0&&f.a<121))return e('Enter a valid age.');if(f.p.length<6)return e('Password must be at least 6 characters.');if(f.p!==f.c)return e('Passwords do not match.');
if(S.users.some(a=>a.email.toLowerCase()==f.e.toLowerCase()))return e('Email already registered.');
const n=mk(f.n.trim(),f.e.trim(),f.ph,f.p,+f.a,f.g);n.med=[];n.hl=[];n.ap=[];n.hi=[];S.users.push(n);save();e('');toast('Registered! Logging in…');sessionStorage.mt_cur=n.id;boot(n)}
function forgot(){modal(`<h3>Reset password</h3><label>Email</label><input id="fe" type="email"><div class="err" id="fer"></div><button class="btn" onclick="const x=S.users.find(a=>a.email.toLowerCase()==$('#fe').value.trim().toLowerCase());if(!x)return $('#fer').textContent='No account with that email.';x.pw='medtrack123';save();modal('<p>Demo reset: your new password is <b>medtrack123</b>. Change it in Settings.</p><button class=btn onclick=closeM()>OK</button>')">Reset</button> <button class="btn s" onclick="closeM()">Cancel</button>`)}
function logout(){S.cur=null;delete sessionStorage.mt_cur;save();location.reload()}
const N=[['dash','🏠','Dashboard'],['med','💊','Medicines'],['rem','⏰','Reminders'],['hl','❤️','Health Tracker'],['stat','📊','Health Statistics'],['wat','💧','Water Tracker'],['ap','🩺','Appointments'],['hi','📋','Medical History'],['pro','👤','Profile'],['nt','🔔','Notifications'],['set','⚙️','Settings'],['about','ℹ️','About Project']];
function boot(x){U=x;$('#auth').classList.add('hide');$('#app').classList.remove('hide');if(U.water.d!==today())U.water={goal:U.water.goal,intake:0,d:today()};theme();go('dash')}
function theme(){document.documentElement.dataset.theme=U.set.dark?'dark':'light'}
function go(v){if(v)V=v;$('#side').classList.remove('open');const un=U.nt.filter(n=>!n.r).length;
$('#side').innerHTML=`<div class="logo">💊 MedTrack</div><div class="tag">Your Medicine. Your Health. Your Reminder.</div>`+N.map(n=>`<a class="${n[0]==V?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}${n[0]=='nt'&&un?`<span class="dot">${un}</span>`:''}</a>`).join('')+`<a onclick="logout()">🚪 Logout</a>`;
$('#main').innerHTML=VW[V]();window.scrollTo(0,0)}
/* medicine helpers */
const act=m=>m.start<=today()&&(!m.end||m.end>=today()),st=m=>m.sd===today()?m.s:(m.time<hm()?'Pending':'Upcoming');
function setS(id,s){const m=U.med.find(x=>x.id==id);m.s=s;m.sd=today();m.snz=0;if(s=='Skipped')notify('Missed medicine',`You skipped ${m.name} (${m.dose}).`);else notify('Medicine',`${m.name} marked as taken.`);save();go();toast('Marked '+s)}
function snz(id,mn=10){const m=U.med.find(x=>x.id==id);m.s='Snoozed';m.sd=today();m.snz=Date.now()+mn*6e4;save();go();toast(`Snoozed ${mn} minutes`)}
const btns=m=>`<button class="btn g sm" onclick="setS(${m.id},'Taken')">Taken</button><button class="btn d sm" onclick="setS(${m.id},'Skipped')">Skip</button><button class="btn w sm" onclick="snz(${m.id})">Snooze</button>`;
function fire(m,test){if(busy||!$('#ov').classList.contains('hide'))return;busy=true;m.fd=today();notify('Medicine reminder',`It's time to take ${m.name} – ${m.dose}.`);save();
if(U.set.notif)try{new Notification('Medicine Reminder',{body:`It's time to take ${m.name} – ${m.dose}.`})}catch(e){}
modal(`<h2>⏰ Medicine Reminder</h2><p>It's time to take <b>${E(m.name)} – ${E(m.dose)}</b>.</p><button class="btn g" onclick="setS(${m.id},'Taken');closeM()">Take Now</button> <button class="btn w" onclick="snz(${m.id},10);closeM()">Snooze 10 Minutes</button> <button class="btn d" onclick="setS(${m.id},'Skipped');closeM()">Skip</button>`)}
setInterval(()=>{if(!U)return;const n=Date.now();for(const m of U.med){if(!act(m))continue;
if(m.sd===today()&&m.s==='Snoozed'&&n>=m.snz){fire(m);return}
if(m.sd!==today()&&m.fd!==today()){const d=mins(hm())-mins(m.time);if(d>=0&&d<=60){fire(m);return}}}
if(U.set.water&&new Date().getMinutes()==0&&new Date().getSeconds()<20&&U.water.intake<U.water.goal){toast('Time to drink some water 💧')}},15000);
/* generic CRUD */
const Fv=(k,l,t,o,r,p)=>({k,l,t,o,r,p});
const C={med:{t:'Medicine',c:['name','dose','time','freq','status'],f:[Fv('name','Medicine Name','text',0,1),Fv('type','Type','select',['Tablet','Capsule','Syrup','Injection','Other']),Fv('dose','Dosage','text',0,1),Fv('time','Time','time',0,1),Fv('freq','Frequency','select',['Once Daily','Twice Daily','Three Times Daily','Weekly','Custom']),Fv('start','Start Date','date',0,1),Fv('end','End Date','date'),Fv('food','Food','select',['Before Food','After Food']),Fv('notes','Instructions / Notes','textarea')]},
hl:{t:'Health Record',c:['date','weight','bp','hr','sugar','sleep','water','steps'],f:[Fv('date','Date','date',0,1),Fv('weight','Weight (kg)','number',0,1),Fv('height','Height (cm)','number',0,1),Fv('bp','Blood Pressure (120/80)','text',0,1,/^\d{2,3}\/\d{2,3}$/),Fv('hr','Heart Rate (bpm)','number'),Fv('sugar','Blood Sugar (mg/dL)','number'),Fv('temp','Temperature (°C)','number'),Fv('sleep','Sleep (hrs)','number'),Fv('water','Water (ml)','number'),Fv('steps','Steps','number'),Fv('cal','Calories','number')]},
ap:{t:'Appointment',c:['doctor','hospital','date','time','reason'],f:[Fv('doctor','Doctor Name','text',0,1),Fv('hospital','Hospital / Clinic','text',0,1),Fv('date','Date','date',0,1),Fv('time','Time','time',0,1),Fv('reason','Reason','text',0,1),Fv('notes','Notes','textarea')]},
hi:{t:'History Entry',c:['kind','title','date','notes'],f:[Fv('kind','Type','select',['Previous Illness','Allergy','Current Condition','Surgery','Important Note']),Fv('title','Title','text',0,1),Fv('date','Date','date'),Fv('notes','Notes','textarea')]}};
const RF=k=>`$('#tb').innerHTML=rows('${k}')`;
function crud(k){const c=C[k];let x=`<div class="bar"><h2>${c.t}s</h2><input id="q" placeholder="🔍 Search…" oninput="${RF(k)}">`;
if(k=='med')x+=`<select id="fs" onchange="${RF(k)}"><option value="">All status</option><option>Taken</option><option>Pending</option><option>Skipped</option><option>Upcoming</option><option>Snoozed</option></select><input id="fd" type="date" title="Active on date" onchange="${RF(k)}">`;
return x+`<button class="btn" onclick="form('${k}')">＋ Add</button></div><div class="tw card" style="padding:0"><table><thead><tr>${c.c.map(h=>`<th>${h}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tb">${rows(k)}</tbody></table></div>`}
function rows(k){const c=C[k],q=($('#q')?.value||'').toLowerCase();let l=U[k].filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));
if(k=='med'){const s=$('#fs')?.value,d=$('#fd')?.value;if(s)l=l.filter(m=>st(m)==s);if(d)l=l.filter(m=>m.start<=d&&(!m.end||m.end>=d))}
if(k=='hl')l.sort((a,b)=>b.date.localeCompare(a.date));if(k=='ap')l.sort((a,b)=>a.date.localeCompare(b.date));
return l.map(r=>`<tr>${c.c.map(f=>`<td>${f=='status'?`<span class="bd ${st(r)}">${st(r)}</span>`:f=='time'?fmt(r.time):E(r[f])}</td>`).join('')}<td>${k=='med'?btns(r):''}<button class="btn s sm" onclick="form('${k}',${r.id})">✏️</button><button class="btn d sm" onclick="confirmD('Delete this entry?',()=>del('${k}',${r.id}))">🗑</button></td></tr>`).join('')||`<tr><td colspan="9" style="text-align:center;color:var(--m)">Nothing found.</td></tr>`}
function del(k,id){U[k]=U[k].filter(r=>r.id!=id);save();go();toast('Deleted')}
function form(k,id){const c=C[k],r=id?U[k].find(x=>x.id==id):{date:today(),start:today()};
modal(`<h3>${id?'Edit':'Add'} ${c.t}</h3><form onsubmit="sv(event,'${k}',${id||0})"><div class="g2">${c.f.map(f=>`<div style="${f.t=='textarea'?'grid-column:1/-1':''}"><label>${f.l}${f.r?' *':''}</label>${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${r[f.k]==o?'selected':''}>${o}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea name="${f.k}" rows="2">${E(r[f.k])}</textarea>`:`<input name="${f.k}" type="${f.t=='number'?'text':f.t}" inputmode="${f.t=='number'?'decimal':'text'}" value="${E(r[f.k])}">`}</div>`).join('')}</div><div class="err" id="fe"></div><button class="btn">Save</button> <button type="button" class="btn s" onclick="closeM()">Cancel</button></form>`)}
function sv(ev,k,id){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
for(const f of C[k].f){let v=(d[f.k]||'').trim();d[f.k]=v;if(f.r&&!v)return $('#fe').textContent=f.l+' is required.';
if(f.t=='number'&&v!==''){if(isNaN(v)||+v<0)return $('#fe').textContent=f.l+' must be a non-negative number.';d[f.k]=+v}
if(f.p&&v&&!f.p.test(v))return $('#fe').textContent='Invalid format for '+f.l+'.'}
if(k=='med'&&d.end&&d.end<d.start)return $('#fe').textContent='End date cannot be before start date.';
if(k=='hl'&&(d.weight==0||d.height==0))return $('#fe').textContent='Weight/height must be greater than 0.';
if(id)Object.assign(U[k].find(x=>x.id==id),d);else U[k].push({id:Date.now(),...d});
if(k=='ap'&&!id)notify('Appointment',`Appointment with ${d.doctor} on ${d.date}.`);
if(k=='hl'&&!id)notify('Health update','New health record saved.');save();closeM();go();toast('Saved ✔')}
/* views */
const bmiC=b=>b<18.5?['Underweight','Eat nutrient-rich food and consult a dietitian.']:b<25?['Normal','Great! Keep up balanced diet and exercise.']:b<30?['Overweight','Add daily activity and watch portion sizes.']:['Obese','Consult a doctor for a weight management plan.'];
function bmiCalc(){const h=+$('#bh').value,w=+$('#bw').value;if(!(h>0&&w>0)){$('#br').innerHTML='<span class="err">Enter positive height and weight.</span>';return}const b=w/(h/100)**2,c=bmiC(b);$('#br').innerHTML=`<div class="v">${b.toFixed(1)} – <span class="bd ${b<25&&b>=18.5?'Taken':'Pending'}">${c[0]}</span></div><p>${c[1]}</p>`}
function chart(t,pts,col,un){if(!pts.length)return`<div class="card"><b>${t}</b><p class="l">No data in range.</p></div>`;const W=300,H=130,ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),sp=mx-mn||1,px=i=>20+i*(W-40)/Math.max(pts.length-1,1),py=y=>H-25-(y-mn)/sp*(H-50);
return`<div class="card"><b>${t}</b> <span class="l">(${un})</span><svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map((p,i)=>px(i)+','+py(p.y)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${px(i)}" cy="${py(p.y)}" r="3.5" fill="${col}"><title>${p.x}: ${p.y}</title></circle>`).join('')}<text x="4" y="12">max ${+mx.toFixed(1)}</text><text x="4" y="${H-4}">min ${+mn.toFixed(1)} · ${pts[0].x.slice(5)} → ${pts.at(-1).x.slice(5)}</text></svg></div>`}
let R={r:'week',f:'',t:''};
function wAdd(n){if(!(n=+n)||n<=0)return toast('Enter a positive amount');U.water.intake+=n;if(U.water.intake>=U.water.goal)notify('Water','Daily water goal reached! 🎉');save();go()}
function wRem(n){if(!(n=+n)||n<0)return toast('Invalid amount');U.water.intake=Math.max(0,U.water.intake-n);save();go()}
const VW={

const aps=U.ap.filter(a=>a.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);

<div class="card"><div class="l">💧 Water Intake</div><div class="v">${w.intake} ml</div><div class="l">${Math.round(w.intake/w.goal*100)}% of goal</div></div><div class="card"><div class="l">❤️ Health Status</div><div class="v">${bc}</div><div class="l">BMI category</div></div>

rem(){const tm=U.med.filter(act);return`<div class="bar"><h2>Reminders</h2><button class="btn s" onclick="try{Notification.requestPermission().then(p=>toast('Notifications: '+p))}catch(e){toast('Not supported')}">Enable browser notifications</button><button class="btn" onclick="const m=U.med.find(act);m?fire(m,1):toast('Add a medicine first')">Test reminder</button></div><div class="tw card" style="padding:0"><table><thead><tr><th>Medicine</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead><tbody>${tm.map(m=>`<tr><td>${E(m.name)} – ${E(m.dose)}</td><td>${fmt(m.time)}</td><td><span class="bd ${st(m)}">${st(m)}</span>${m.s=='Snoozed'&&m.sd==today()?' until '+new Date(m.snz).toTimeString().slice(0,5):''}</td><td>${btns(m)}<button class="btn d sm" onclick="m=U.med.find(x=>x.id==${m.id});m.sd='';m.s='';save();go();toast('Reminder reset')">Cancel</button></td></tr>`).join('')||'<tr><td colspan=4>No active reminders.</td></tr>'}</tbody></table></div>`},
stat(){const t=today();let f=R.r=='week'?dAgo(6):R.r=='month'?dAgo(29):R.f||'0000',to=R.r=='custom'&&R.t?R.t:t,l=U.hl.filter(r=>r.date>=f&&r.date<=to).sort((a,b)=>a.date.localeCompare(b.date)),P=k=>l.filter(r=>r[k]!==''&&r[k]!=null).map(r=>({x:r.date,y:+r[k]}));
return`<div class="bar"><h2>Health Statistics</h2><select onchange="R.r=this.value;go()">${['week','month','custom'].map(o=>`<option value="${o}" ${R.r==o?'selected':''}>${o=='week'?'Weekly':o=='month'?'Monthly':'Custom range'}</option>`).join('')}</select>${R.r=='custom'?`<input type="date" value="${R.f}" onchange="R.f=this.value;go()"><input type="date" value="${R.t}" onchange="R.t=this.value;go()">`:''}</div><div class="charts">${chart('Weight',P('weight'),'#0e9aa7','kg')}${chart('Blood pressure (systolic)',l.filter(r=>r.bp).map(r=>({x:r.date,y:+r.bp.split('/')[0]})),'#d64545','mmHg')}${chart('Heart rate',P('hr'),'#e07a1f','bpm')}${chart('Water intake',P('water'),'#2f80ed','ml')}${chart('Sleep',P('sleep'),'#8a5cf6','hrs')}${chart('Daily steps',P('steps'),'#1b9d5a','steps')}</div>`},
wat(){const w=U.water,p=Math.min(100,Math.round(w.intake/w.goal*100));return`<h2>Water Tracker</h2><div class="card"><p>Daily Goal: <b>${w.goal} ml</b> · Consumed: <b>${w.intake} ml</b></p><div class="prog"><i style="width:${p}%"></i></div><h3>${p}%</h3><p class="l">${p<100?'Time to drink some water 💧':'Goal reached! 🎉'}</p>
<button class="btn" onclick="wAdd(250)">＋250 ml</button> <button class="btn" onclick="wAdd(500)">＋500 ml</button> <button class="btn s" onclick="wRem(250)">−250 ml</button><div class="g2" style="margin-top:12px"><div><label>Custom amount (ml)</label><input id="wc" type="number" value="200"></div><div style="align-self:end"><button class="btn" onclick="wAdd($('#wc').value)">Add</button> <button class="btn s" onclick="wRem($('#wc').value)">Remove</button></div></div>
<div class="g2"><div><label>Daily goal (ml)</label><input id="wg" type="number" value="${w.goal}"></div><div style="align-self:end"><button class="btn s" onclick="const g=+$('#wg').value;if(!(g>0))return toast('Goal must be positive');U.water.goal=g;save();go()">Set goal</button></div></div></div>`},
ap:()=>crud('ap'),hi:()=>crud('hi'),

<form onsubmit="pf(event)"><div class="g2"><div><label>Name</label><input name="name" value="${E(U.name)}"></div><div><label>Phone</label><input name="phone" value="${E(U.phone)}"></div><div><label>Age</label><input name="age" value="${U.age}"></div><div><label>Gender</label><select name="gender">${['Female','Male','Other'].map(o=>`<option ${U.gender==o?'selected':''}>${o}</option>`).join('')}</select></div><div><label>Height (cm)</label><input name="height" value="${U.height}"></div><div><label>Weight (kg)</label><input name="weight" value="${U.weight}"></div></div><div class="err" id="pe"></div><button class="btn">Save profile</button></form></div>
<div class="card"><h3>🚨 Emergency Contact</h3><form onsubmit="ef(event)"><div class="g2"><div><label>Name</label><input name="name" value="${E(e.name)}"></div><div><label>Relationship</label><input name="rel" value="${E(e.rel)}"></div><div><label>Phone</label><input name="phone" value="${E(e.phone)}"></div></div><div class="err" id="ee"></div><button class="btn">Save contact</button> <button type="button" class="btn d" onclick="confirmD('Delete emergency contact?',()=>{U.ec={name:'',rel:'',phone:''};save();go()})">Delete</button></form><p>${e.phone?`<a class="sos" href="tel:${E(e.phone)}">🚨 Emergency Call – ${E(e.name)}</a>`:'<span class="l">Add a contact to enable the Emergency Call button.</span>'}</p></div>`},
nt(){return`<div class="bar"><h2>Notifications</h2><button class="btn s" onclick="U.nt.forEach(n=>n.r=1);save();go()">Mark all read</button><button class="btn d" onclick="U.nt=[];save();go()">Clear all</button></div><div class="card" style="padding:0">${U.nt.map(n=>`<div class="nt ${n.r?'':'un'}"><div style="flex:1">${{'Medicine reminder':'💊','Medicine':'💊','Missed medicine':'⚠️','Water':'💧','Appointment':'🩺'}[n.k]||'❤️'} <b>${E(n.k)}</b>: ${E(n.m)}<br><span class="l">${n.t}</span></div>${n.r?'':`<button class="btn s sm" onclick="U.nt.find(x=>x.id==${n.id}).r=1;save();go()">Mark read</button>`}<button class="btn d sm" onclick="U.nt=U.nt.filter(x=>x.id!=${n.id});save();go()">🗑</button></div>`).join('')||'<p style="padding:16px" class="l">No notifications.</p>'}</div>`},

about(){return`<h2>About Project</h2><div class="card"><p><b>MedTrack is an OOP-based Medicine Reminder and Health Tracking System developed in C++. It helps users manage medicines, reminders, health records, water intake, appointments and medical history using object-oriented programming concepts.</b></p>
<h3>Project Objective</h3><p>Help users never miss a dose and monitor everyday health with a simple, reliable system.</p><h3>Features</h3><p>Login/registration, medicine CRUD &amp; reminders, health records &amp; charts, BMI, water tracker, appointments, medical history, notifications, dark mode.</p>
<h3>OOP Concepts Used</h3><p><b>Encapsulation</b> (private data + getters/setters), <b>Inheritance</b> (<code>User : public Person</code>), <b>Polymorphism</b> (virtual <code>display()</code>, overloaded functions), <b>Constructors</b>, <b>File handling</b> (users.txt, medicines.txt, reminders.txt, health_records.txt, appointments.txt).</p>
<p><b>Class model:</b> User, Medicine, Reminder, HealthRecord, Appointment, WaterTracker, MedicalHistory — each UI module maps to one class (objects here are JSON stored in localStorage and can be swapped for C++ file I/O).</p>
<h3>Technologies Used</h3><p>C++ (backend design), HTML, CSS, JavaScript, localStorage.</p><h3>Future Scope</h3><p>C++ REST backend, mobile app, SMS/email alerts, doctor sharing, wearable sync.</p></div>`}};
function ph(i){const f=i.files[0];if(!f)return;if(f.size>3e5)return toast('Image too large (max 300 KB)');const r=new FileReader();r.onload=()=>{U.photo=r.result;save();go()};r.readAsDataURL(f)}
